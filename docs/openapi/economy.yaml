openapi: "3.0.3"
info: { title: "Qaryati API - Economy", version: "1.1.0", description: "Economy and agriculture read, create, update and soft-delete APIs. Paths include /api/v1; use a server origin without that prefix. GET operations are public; writes require Bearer tokens. Every response carries X-Request-Id. All operations are subject to the global rate limit (429). See docs/economy.md for domain rules and manual examples." }
servers:
  - { url: "/", description: "Current API origin; replace with the target server origin when importing." }
tags:
  - { name: "Economy", description: "Economy APIs." }
x-implementation-source: { module: "src/modules/economy/", tests: "tests/economy*.test.ts" }
paths:
  /api/v1/villages/{villageId}/economy:
    post:
      "tags": ["Economy"]
      "operationId": "createEconomicActivity"
      "summary": "Create an economic activity"
      "description": "EDITOR, REVIEWER and ADMIN may create. Requires an active village and source. Creates PENDING/version 1 and assigns creator/updater from token. Creation and one EconomicActivity CREATE audit commit together. Source status is unrestricted."
      "security": [{"EconomyBearerAuth":[]}]
      "x-allowed-roles": ["EDITOR","REVIEWER","ADMIN"]
      "parameters": [{"$ref":"#/components/parameters/ContentVillageId"}]
      "responses":
        "201":
          "description": "Created activity with verificationStatus PENDING and server-assigned version 1."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/EconomicActivityResponse"
        "400":
          "description": "VALIDATION_ERROR: invalid village UUID, missing name/category/sourceId, invalid field types/ranges, or unknown/protected body fields. Malformed JSON returns INVALID_JSON."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "401":
          "description": "UNAUTHORIZED: missing, invalid, expired or unsupported-role Bearer token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "403":
          "description": "FORBIDDEN if the authenticated role is not allowed by the route. All currently supported roles (EDITOR, REVIEWER, ADMIN) may create; there is no ownership restriction. Unsupported token roles return 401."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "404":
          "description": "NOT_FOUND: the village or required source does not exist or is soft-deleted."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "413":
          "description": "PAYLOAD_TOO_LARGE: JSON exceeds 1 MB."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "429":
          "description": "TOO_MANY_REQUESTS: global rate limit exceeded."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "500":
          "description": "INTERNAL_ERROR: database/audit failure rolls back writes; internal details are not exposed in production."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateEconomyRequest"
    get:
      tags: ["Economy"]
      operationId: "listVillageEconomicActivities"
      summary: "List a village's economic activities"
      description: "Only non-deleted records belonging to a non-deleted village are visible. PENDING, VERIFIED and REJECTED records are public. Source deletion does not hide records. A missing or deleted village returns 404. An active village without matches, or a page beyond the results, returns 200 with an empty data array. Unknown query keys are stripped and ignored. After defaults and the limit cap, (page - 1) * effectiveLimit must be a safe integer no greater than 2147483647; otherwise 400 with field query.page."
      security: []
      parameters:
        - { $ref: "#/components/parameters/ContentVillageId" }
        - { $ref: "#/components/parameters/ContentPage" }
        - { $ref: "#/components/parameters/ContentLimit" }
        - name: "search"
          in: "query"
          description: "Case-insensitive literal contains search across name and description. Trimmed; blank text is ignored. Percent signs, underscores and backslashes are escaped for literal matching."
          schema: { type: "string", maxLength: 100 }
          example: "سلال"
        - name: "category"
          in: "query"
          description: "Exact, case-sensitive enum value; whitespace is not trimmed."
          schema: { $ref: "#/components/schemas/EconomicCategory" }
        - { $ref: "#/components/parameters/ContentVerificationStatus" }
        - name: "isMajor"
          in: "query"
          description: "Only the lowercase strings true and false are accepted; false filters for non-major activities. Omit for either value."
          schema:
            type: "string"
            enum: ["true", "false"]
          example: "false"
        - name: "asOfYear"
          in: "query"
          description: "Exact match on the stored year. Negative years and zero are accepted; blank values are rejected. When supplied, records with null asOfYear do not match."
          schema: { type: "integer", format: "int32", minimum: -2147483648, maximum: 2147483647 }
          example: 2014
        - name: "sort"
          in: "query"
          description: "Primary sort field. ID ascending is always appended as a stable tie-breaker. Null asOfYear values sort last in either direction."
          schema:
            type: "string"
            enum: ["name", "asOfYear", "createdAt", "updatedAt"]
            default: "name"
        - { $ref: "#/components/parameters/ContentOrder" }
      responses:
        "200":
          description: "A page of economic activities."
          headers:
            X-Request-Id:
              description: "Request correlation ID."
              schema: { type: "string" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EconomicActivityListResponse" }
              examples:
                page:
                  summary: "One matching record"
                  value:
                    data:
                      - id: "22222222-2222-4222-8222-222222222222"
                        villageId: "11111111-1111-4111-8111-111111111111"
                        category: "CRAFT"
                        name: "صناعة السلال"
                        description: null
                        isMajor: false
                        asOfYear: null
                        sourceId: null
                        verificationStatus: "PENDING"
                        version: 1
                        createdAt: "2026-10-10T00:00:00.000Z"
                        updatedAt: "2026-10-10T00:00:00.000Z"
                    meta:
                      page: 1
                      limit: 20
                      total: 1
                      totalPages: 1
                      hasNextPage: false
                      hasPrevPage: false
                empty:
                  summary: "No matching records on page 1"
                  value:
                    data: []
                    meta:
                      page: 1
                      limit: 20
                      total: 0
                      totalPages: 0
                      hasNextPage: false
                      hasPrevPage: false
        "400": { $ref: "#/components/responses/ContentValidationError" }
        "404": { $ref: "#/components/responses/ContentVillageNotFound" }
        "429": { $ref: "#/components/responses/ContentTooManyRequests" }
        "500": { $ref: "#/components/responses/ContentInternalError" }
  /api/v1/economy/{id}:
    patch:
      "tags": ["Economy"]
      "operationId": "updateEconomicActivity"
      "summary": "Partially update an economic activity"
      "description": "EDITOR may edit only their own PENDING record; REVIEWER/ADMIN any active record. Requires current version and an editable field. Omitted fields are preserved. Changed sources must be active. Every accepted edit resets PENDING, increments version once, sets updater and writes one UPDATE audit atomically. Audit failure rolls back the update."
      "security": [{"EconomyBearerAuth":[]}]
      "x-allowed-roles": ["EDITOR","REVIEWER","ADMIN"]
      "parameters": [{"$ref":"#/components/parameters/ContentId"}]
      "responses":
        "200":
          "description": "Updated activity with verificationStatus PENDING and version incremented exactly once."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/EconomicActivityResponse"
        "400":
          "description": "VALIDATION_ERROR: invalid UUID/body, missing version, no editable fields, invalid ranges/types or protected fields. Malformed JSON returns INVALID_JSON."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "401":
          "description": "UNAUTHORIZED: missing, invalid, expired or unsupported-role Bearer token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "403":
          "description": "CHANGE_REQUEST_REQUIRED when an EDITOR edits a non-PENDING record; ECONOMY_EDIT_FORBIDDEN when an EDITOR edits a PENDING record created by another user or with no creator. REVIEWER and ADMIN may edit any active record. FORBIDDEN if the authenticated role is not allowed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "404":
          "description": "NOT_FOUND: the activity or parent village does not exist or is soft-deleted, or a newly selected source does not exist or is soft-deleted. An unchanged source is not revalidated."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "409":
          "description": "VERSION_CONFLICT: reload before retrying; details contain the current version."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
              "example":
                "error":
                  "code": "VERSION_CONFLICT"
                  "message": "The economic activity was changed by someone else; reload it and retry"
                  "details": [{"field":"version","message":"Current version is 2"}]
                  "requestId": "example-request"
        "413":
          "description": "PAYLOAD_TOO_LARGE: JSON exceeds 1 MB."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "429":
          "description": "TOO_MANY_REQUESTS: global rate limit exceeded."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "500":
          "description": "INTERNAL_ERROR: database/audit failure rolls back writes; internal details are not exposed in production."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/UpdateEconomyRequest"
    delete:
      "tags": ["Economy"]
      "operationId": "deleteEconomicActivity"
      "summary": "Soft delete an economic activity"
      "description": "ADMIN only. This operation has no request body. Sets deletedAt/updater; preserves row, version and relations. One DELETE audit shares the transaction. Repeated deletion returns 404. Public reads exclude deleted records."
      "security": [{"EconomyBearerAuth":[]}]
      "x-allowed-roles": ["ADMIN"]
      "parameters": [{"$ref":"#/components/parameters/ContentId"}]
      "responses":
        "204":
          "description": "Activity soft-deleted; empty response body."
        "400":
          "description": "VALIDATION_ERROR: invalid activity UUID. If a JSON body is sent despite this operation having no request body, the global JSON parser can return INVALID_JSON for malformed JSON."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "401":
          "description": "UNAUTHORIZED: missing, invalid, expired or unsupported-role Bearer token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "403":
          "description": "FORBIDDEN: only ADMIN may delete. EDITOR and REVIEWER are denied, regardless of ownership or verification status."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "404":
          "description": "NOT_FOUND: the activity or parent village does not exist or is soft-deleted. Repeated deletion also returns 404."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "413":
          "description": "PAYLOAD_TOO_LARGE: a supplied JSON body exceeds the global 1 MB limit. This operation has no request body."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "429":
          "description": "TOO_MANY_REQUESTS: global rate limit exceeded."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "500":
          "description": "INTERNAL_ERROR: database/audit failure rolls back writes; internal details are not exposed in production."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
    get:
      tags: ["Economy"]
      operationId: "getEconomicActivity"
      summary: "Get an economic activity"
      description: "Only non-deleted records belonging to a non-deleted village are visible. PENDING, VERIFIED and REJECTED records are public. Source deletion does not hide records."
      security: []
      parameters:
        - { $ref: "#/components/parameters/ContentId" }
      responses:
        "200":
          description: "The economic activity."
          headers:
            X-Request-Id:
              description: "Request correlation ID."
              schema: { type: "string" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EconomicActivityResponse" }
              example:
                data:
                  id: "22222222-2222-4222-8222-222222222222"
                  villageId: "11111111-1111-4111-8111-111111111111"
                  category: "CRAFT"
                  name: "صناعة السلال"
                  description: null
                  isMajor: false
                  asOfYear: null
                  sourceId: null
                  verificationStatus: "PENDING"
                  version: 1
                  createdAt: "2026-10-10T00:00:00.000Z"
                  updatedAt: "2026-10-10T00:00:00.000Z"
        "400": { $ref: "#/components/responses/ContentIdValidationError" }
        "404": { $ref: "#/components/responses/EconomicActivityNotFound" }
        "429": { $ref: "#/components/responses/ContentTooManyRequests" }
        "500": { $ref: "#/components/responses/ContentInternalError" }
components:
  securitySchemes:
    EconomyBearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ContentVillageId:
      name: "villageId"
      in: "path"
      required: true
      description: "Village UUID; slugs are not accepted."
      schema: { type: "string", format: "uuid" }
      example: "11111111-1111-4111-8111-111111111111"
    ContentId:
      name: "id"
      in: "path"
      required: true
      description: "Resource UUID."
      schema: { type: "string", format: "uuid" }
      example: "22222222-2222-4222-8222-222222222222"
    ContentPage:
      name: "page"
      in: "query"
      description: "Positive integer. Defaults to 1."
      schema: { type: "integer", minimum: 1, default: 1 }
      example: 1
    ContentLimit:
      name: "limit"
      in: "query"
      description: "Positive integer. Values above 100 are accepted and capped at 100; defaults to 20."
      schema: { type: "integer", minimum: 1, default: 20 }
      example: 20
    ContentVerificationStatus:
      name: "verificationStatus"
      in: "query"
      description: "Exact, case-sensitive status. Omit to include all three statuses."
      schema: { $ref: "#/components/schemas/ContentVerificationStatus" }
    ContentOrder:
      name: "order"
      in: "query"
      description: "Sort direction; ties always use ID ascending."
      schema:
        type: "string"
        enum: ["asc", "desc"]
        default: "asc"
  schemas:
    CreateEconomyRequest:
      "type": "object"
      "additionalProperties": false
      "required": ["name","category","sourceId"]
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
          "description": "Trimmed; nonblank."
        "category":
          "$ref": "#/components/schemas/EconomicCategory"
        "sourceId":
          "type": "string"
          "format": "uuid"
        "description":
          "type": "string"
          "maxLength": 5000
          "description": "Trimmed; empty allowed."
        "isMajor":
          "type": "boolean"
          "default": false
        "asOfYear":
          "type": "integer"
          "minimum": -2147483648
          "maximum": 2147483647
          "nullable": true
    UpdateEconomyRequest:
      "type": "object"
      "additionalProperties": false
      "required": ["version"]
      "minProperties": 2
      "description": "Omitted fields preserved; description/year can be null, source cannot be removed. Unchanged sources are not revalidated. IDs, actor fields, status and timestamps are protected."
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
          "description": "Trimmed; nonblank."
        "category":
          "$ref": "#/components/schemas/EconomicCategory"
        "sourceId":
          "type": "string"
          "format": "uuid"
        "description":
          "type": "string"
          "maxLength": 5000
          "description": "Trimmed; empty allowed."
          "nullable": true
        "isMajor":
          "type": "boolean"
        "asOfYear":
          "type": "integer"
          "minimum": -2147483648
          "maximum": 2147483647
          "nullable": true
        "version":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483646
    ContentVerificationStatus:
      type: "string"
      enum: ["PENDING", "VERIFIED", "REJECTED"]
    ContentPaginationMeta:
      type: "object"
      required: ["page", "limit", "total", "totalPages", "hasNextPage", "hasPrevPage"]
      properties:
        page: { type: "integer", minimum: 1, description: "Requested page, including when it is beyond the last result." }
        limit: { type: "integer", minimum: 1, maximum: 100, description: "Effective page size after the cap." }
        total: { type: "integer", minimum: 0, description: "Total matching visible records before pagination." }
        totalPages: { type: "integer", minimum: 0, description: "Zero when total is zero; otherwise ceil(total / limit)." }
        hasNextPage: { type: "boolean", description: "Whether page is less than totalPages." }
        hasPrevPage: { type: "boolean", description: "Whether page is greater than 1, even when no results match." }
    ContentErrorDetail:
      type: "object"
      required: ["field", "message"]
      properties:
        field: { type: "string", description: "Validation location, such as params.villageId, query.page or body.sourceId." }
        message: { type: "string" }
    ContentErrorResponse:
      type: "object"
      required: ["error"]
      properties:
        error:
          type: "object"
          required: ["code", "message", "details", "requestId"]
          properties:
            code: { type: "string" }
            message: { type: "string" }
            details:
              type: "array"
              items: { $ref: "#/components/schemas/ContentErrorDetail" }
            requestId: { type: "string", description: "Also returned in the X-Request-Id response header." }
            stack: { type: "string", description: "Optional stack trace on HTTP 500 errors in development only." }
    EconomicCategory:
      type: "string"
      enum: ["CROP", "LIVESTOCK", "CRAFT", "INDUSTRY", "TRADE", "OTHER"]
    EconomicActivity:
      type: "object"
      required: ["id", "villageId", "category", "name", "description", "isMajor", "sourceId", "verificationStatus", "version", "createdAt", "updatedAt", "asOfYear"]
      properties:
        id: { type: "string", format: "uuid" }
        villageId: { type: "string", format: "uuid" }
        category: { $ref: "#/components/schemas/EconomicCategory" }
        name: { type: "string" }
        description: { type: "string", nullable: true }
        isMajor: { type: "boolean" }
        sourceId: { type: "string", format: "uuid", nullable: true, description: "Source identifier only; no source object is embedded." }
        verificationStatus: { $ref: "#/components/schemas/ContentVerificationStatus" }
        version: { type: "integer" }
        createdAt: { type: "string", format: "date-time" }
        updatedAt: { type: "string", format: "date-time" }
        asOfYear: { type: "integer", format: "int32", minimum: -2147483648, maximum: 2147483647, nullable: true }
      description: "Public representation shared by GET, POST and PATCH responses. Nullable properties are returned as null; creator/updater IDs and deletedAt are not exposed."
      example:
        id: "22222222-2222-4222-8222-222222222222"
        villageId: "11111111-1111-4111-8111-111111111111"
        category: "CRAFT"
        name: "صناعة السلال"
        description: null
        isMajor: false
        asOfYear: null
        sourceId: null
        verificationStatus: "PENDING"
        version: 1
        createdAt: "2026-10-10T00:00:00.000Z"
        updatedAt: "2026-10-10T00:00:00.000Z"
    EconomicActivityResponse:
      type: "object"
      required: ["data"]
      properties:
        data: { $ref: "#/components/schemas/EconomicActivity" }
    EconomicActivityListResponse:
      type: "object"
      required: ["data", "meta"]
      properties:
        data:
          type: "array"
          items: { $ref: "#/components/schemas/EconomicActivity" }
        meta: { $ref: "#/components/schemas/ContentPaginationMeta" }
  responses:
    ContentValidationError:
      description: "Invalid path or query parameters (VALIDATION_ERROR); malformed JSON is INVALID_JSON when a JSON body is sent."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - { field: "params.villageId", message: "Invalid UUID" }
              requestId: "example-request-123"
    ContentVillageNotFound:
      description: "Village does not exist or is soft-deleted."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "NOT_FOUND"
              message: "Village not found"
              details: []
              requestId: "example-request-123"
    ContentInternalError:
      description: "Unexpected database or application failure. Production responses do not expose internal error details."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "Internal server error"
              details: []
              requestId: "example-request-123"
    ContentTooManyRequests:
      description: "Global rate limit exceeded when rate limiting is enabled."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
        Retry-After:
          description: "Seconds until retry."
          schema: { type: "integer" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "TOO_MANY_REQUESTS"
              message: "Too many requests; please try again later"
              details: []
              requestId: "example-request-123"
    EconomicActivityNotFound:
      description: "Resource is missing, soft-deleted, or belongs to a soft-deleted village."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "NOT_FOUND"
              message: "Economic activity not found"
              details: []
              requestId: "example-request-123"
    ContentIdValidationError:
      description: "Invalid resource UUID (VALIDATION_ERROR)."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - { field: "params.id", message: "Invalid UUID" }
              requestId: "example-request-123"
