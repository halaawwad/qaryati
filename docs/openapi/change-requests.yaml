openapi: 3.0.3
info:
  title: Qaryati API - Change Requests
  version: '1.0.0'
servers:
  - url: /
paths:
  /api/v1/change-requests:
    get:
      summary: List change requests
      operationId: listChangeRequests
      description: >-
        Authentication required. Editors see only their own requests and cannot
        supply requestedById; reviewers and administrators see all requests and
        may filter by requester. Filters combine with AND. Ordered by createdAt
        descending then id ascending; count and results use a consistent snapshot.
        Historical requests remain visible when their targets change or are deleted.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, description: Capped at 100., schema: { type: integer, minimum: 1, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
        - { name: entityType, in: query, schema: { type: string, enum: [PopulationRecord] } }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { name: requestedById, in: query, description: Reviewer or administrator only., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Page of requests and filtered pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ChangeRequest' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
              example:
                data:
                  - { id: '44444444-4444-4444-8444-444444444444', entityType: PopulationRecord, entityId: '33333333-3333-4333-8333-333333333333', baseVersion: 3, proposedChanges: { notes: Fictional revised note }, reason: Fictional correction, status: PENDING, requestedById: '11111111-1111-4111-8111-111111111111', reviewedById: null, reviewComment: null, createdAt: '2026-01-01T10:00:00.000Z', updatedAt: '2026-01-01T10:00:00.000Z', reviewedAt: null }
                meta: { page: 1, limit: 20, total: 1, totalPages: 1, hasNextPage: false, hasPrevPage: false }
        '400': { $ref: '#/components/responses/ListValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      summary: Submit a Population change request
      operationId: submitPopulationChangeRequest
      description: >-
        Only an authenticated EDITOR may submit. The active Population record must
        be VERIFIED and baseVersion must match. The proposal must make an actual
        change; replacement sources must be active. An unchanged source may be
        retained even if deleted. An actual proposal against version 2147483647
        conflicts. Reason is optional and multiple pending requests are allowed;
        these are provisional submission policies. Submission does not modify the
        Population record or reserve a preferred slot, and does not guarantee that
        the proposal will remain applicable. Request creation and audit are atomic.
        Proposed source UUIDs are stored in lowercase and compared case-insensitively.
        Known separate issue: Population PATCH compares source UUID strings by case;
        this endpoint does not change PATCH behavior.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Submission' }
            example: { entityType: PopulationRecord, entityId: '33333333-3333-4333-8333-333333333333', baseVersion: 3, proposedChanges: { notes: Fictional revised note }, reason: Fictional correction }
      responses:
        '201':
          description: Pending change request created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ChangeRequest' }
              example: &pendingResponse
                data: { id: '44444444-4444-4444-8444-444444444444', entityType: PopulationRecord, entityId: '33333333-3333-4333-8333-333333333333', baseVersion: 3, proposedChanges: { notes: Fictional revised note }, reason: Fictional correction, status: PENDING, requestedById: '11111111-1111-4111-8111-111111111111', reviewedById: null, reviewComment: null, createdAt: '2026-01-01T10:00:00.000Z', updatedAt: '2026-01-01T10:00:00.000Z', reviewedAt: null }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/PopulationVersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/change-requests/{id}/reject:
    post:
      summary: Reject a pending change request
      operationId: rejectChangeRequest
      description: >-
        REVIEWER or ADMIN only. Only a PENDING request can be rejected; repeated
        rejection and rejection of an approved request return 409. The reviewer
        and time are recorded by the server. Self-review is not restricted by
        this endpoint. Stale proposals and requests with inactive or deleted
        targets remain rejectable. Rejection and its audit are atomic and do not
        modify Population or Sources.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewComment]
              properties:
                reviewComment: { type: string, minLength: 1, maxLength: 5000, description: Trimmed and must not be blank. }
            example: { reviewComment: Fictional review comment }
      responses:
        '200':
          description: Rejected change request.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ChangeRequest' }
              example:
                data: { id: '44444444-4444-4444-8444-444444444444', entityType: PopulationRecord, entityId: '33333333-3333-4333-8333-333333333333', baseVersion: 3, proposedChanges: { notes: Fictional revised note }, reason: Fictional correction, status: REJECTED, requestedById: '11111111-1111-4111-8111-111111111111', reviewedById: '22222222-2222-4222-8222-222222222222', reviewComment: Fictional review comment, createdAt: '2026-01-01T10:00:00.000Z', updatedAt: '2026-01-01T11:00:00.000Z', reviewedAt: '2026-01-01T11:00:00.000Z' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ChangeRequestNotFound' }
        '409': { $ref: '#/components/responses/RequestNotPending' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/change-requests/{id}:
    get:
      summary: Get a change request
      operationId: getChangeRequest
      description: >-
        Authentication required. Editors can read only their own requests; other
        requests and missing IDs both return 404. Reviewers and administrators
        may read all requests, including those whose targets are no longer active.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Change request.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ChangeRequest' }
              example: *pendingResponse
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ChangeRequestNotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: >-
        Error envelope. Codes include VALIDATION_ERROR for invalid or unchanged
        proposals, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, and CONFLICT for a stale,
        ineligible, concurrently changed, or version-exhausted target.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ListValidationError:
      description: Invalid list query parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: VALIDATION_ERROR, message: Request validation failed, details: [{ field: query.page, message: Pagination offset must not exceed 2147483647 }], requestId: example-request-400 }
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: UNAUTHORIZED, message: Authentication required, details: [], requestId: example-request-401 }
    Forbidden:
      description: The authenticated role or requested filter is not permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: FORBIDDEN, message: You do not have permission to perform this action, details: [], requestId: example-request-403 }
    ChangeRequestNotFound:
      description: The request is missing or not visible to this editor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: NOT_FOUND, message: Change request not found, details: [], requestId: example-request-404 }
    PopulationVersionConflict:
      description: Conflict, including a stale Population base version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: CONFLICT, message: Population record version conflict, details: [], requestId: example-request-409 }
    RequestNotPending:
      description: The Change Request is not pending or changed during review.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: CONFLICT, message: Change request is not pending, details: [], requestId: example-request-409 }
    PayloadTooLarge:
      description: The global JSON parser rejected a body larger than 1 MB, before route authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: PAYLOAD_TOO_LARGE, message: Request body is too large, details: [], requestId: example-request-413 }
    RateLimited:
      description: The global rate limiter rejected the request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: TOO_MANY_REQUESTS, message: 'Too many requests; please try again later', details: [], requestId: example-request-429 }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPrevPage]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
        hasPrevPage: { type: boolean }
    Proposal:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        population: { type: integer, minimum: 1, maximum: 2147483647 }
        referenceYear: { type: integer, minimum: 1800, maximum: 2100 }
        referenceDate: { type: string, format: date-time, nullable: true }
        sourceId: { type: string, format: uuid }
        isEstimate: { type: boolean }
        notes: { type: string, nullable: true, maxLength: 5000 }
    Submission:
      type: object
      additionalProperties: false
      required: [entityType, entityId, baseVersion, proposedChanges]
      properties:
        entityType: { type: string, enum: [PopulationRecord] }
        entityId: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        proposedChanges: { $ref: '#/components/schemas/Proposal' }
        reason: { type: string, maxLength: 5000, description: Trimmed before storage. }
    ChangeRequest:
      type: object
      required: [id, entityType, entityId, baseVersion, proposedChanges, reason, status, requestedById, reviewedById, reviewComment, createdAt, updatedAt, reviewedAt]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string, enum: [PopulationRecord] }
        entityId: { type: string, format: uuid }
        baseVersion: { type: integer }
        proposedChanges: { $ref: '#/components/schemas/Proposal' }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        requestedById: { type: string, format: uuid }
        reviewedById: { type: string, format: uuid, nullable: true }
        reviewComment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
