openapi: "3.0.3"
info: { title: "Qaryati API - Landmarks", version: "1.0.0", description: "GET behavior matches the documentation branch. POST is implemented only on feature/landmarks-create among the inspected branches. This standalone file documents the implemented routes, not deployment availability. Paths include /api/v1, so use a server origin without that prefix. Public GET operations require no authentication. Every response carries X-Request-Id. All operations are subject to the configured global rate limit (429)." }
servers:
  - { url: "/", description: "Current API origin; replace with the target server origin when importing." }
tags:
  - { name: "Landmarks", description: "Landmarks APIs." }
x-implementation-source: { ref: "feature/landmarks-create", commit: "8df069b78cbc5ff2e217e7ac94000e0651ac0aa6", module: "src/modules/landmarks/", tests: "tests/landmarks*.test.ts" }
paths:
  /api/v1/villages/{villageId}/landmarks:
    get:
      tags: ["Landmarks"]
      operationId: "listVillageLandmarks"
      summary: "List a village's landmarks"
      description: "Only non-deleted records belonging to a non-deleted village are visible. PENDING, VERIFIED and REJECTED records are public. Source deletion does not hide records. A missing or deleted village returns 404. An active village without matches, or a page beyond the results, returns 200 with an empty data array. Unknown query keys are stripped and ignored."
      security: []
      parameters:
        - { $ref: "#/components/parameters/ContentVillageId" }
        - { $ref: "#/components/parameters/ContentPage" }
        - { $ref: "#/components/parameters/ContentLimit" }
        - name: "search"
          in: "query"
          description: "Case-insensitive contains search across nameAr and nameEn only. Trimmed; blank text is ignored. The current repository does not escape PostgreSQL ILIKE patterns: % and _ are wildcards and backslash is the escape character."
          schema: { type: "string", maxLength: 100 }
          example: "عين"
        - name: "landmarkType"
          in: "query"
          description: "Exact, case-sensitive enum value; whitespace is not trimmed."
          schema: { $ref: "#/components/schemas/LandmarkType" }
        - { $ref: "#/components/parameters/ContentVerificationStatus" }
        - name: "sort"
          in: "query"
          description: "Primary sort field. ID ascending is always appended as a stable tie-breaker. Null nameEn values sort last in either direction."
          schema:
            type: "string"
            enum: ["nameAr", "nameEn", "createdAt"]
            default: "nameAr"
        - { $ref: "#/components/parameters/ContentOrder" }
      responses:
        "200":
          description: "A page of landmarks."
          headers:
            X-Request-Id:
              description: "Request correlation ID."
              schema: { type: "string" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandmarkListResponse" }
              examples:
                page:
                  summary: "One matching record"
                  value:
                    data:
                      - id: "22222222-2222-4222-8222-222222222222"
                        villageId: "11111111-1111-4111-8111-111111111111"
                        nameAr: "عين البلد"
                        nameEn: null
                        landmarkType: "SPRING"
                        description: null
                        latitude: null
                        longitude: null
                        sourceId: null
                        verificationStatus: "PENDING"
                        version: 1
                        createdAt: "2026-10-10T00:00:00.000Z"
                        updatedAt: "2026-10-10T00:00:00.000Z"
                    meta:
                      page: 1
                      limit: 20
                      total: 1
                      totalPages: 1
                      hasNextPage: false
                      hasPrevPage: false
                empty:
                  summary: "No matching records on page 1"
                  value:
                    data: []
                    meta:
                      page: 1
                      limit: 20
                      total: 0
                      totalPages: 0
                      hasNextPage: false
                      hasPrevPage: false
        "400": { $ref: "#/components/responses/ContentValidationError" }
        "404": { $ref: "#/components/responses/ContentVillageNotFound" }
        "429": { $ref: "#/components/responses/ContentTooManyRequests" }
        "500": { $ref: "#/components/responses/ContentInternalError" }
    post:
      tags: ["Landmarks"]
      operationId: "createVillageLandmark"
      summary: "Create a landmark"
      description: "Requires a Bearer access token with EDITOR, REVIEWER or ADMIN role. Authentication and role checks precede route validation. The village and source must exist and not be soft-deleted; source verification status is unrestricted. Creates PENDING status and version 1, assigns createdById and updatedById from the token, and commits a CREATE audit log in the same transaction. Audit or database failure returns 500 and rolls back the transaction. Creator/updater IDs are not included in the response."
      security:
        - LandmarkBearerAuth: []
      x-allowed-roles: ["EDITOR", "REVIEWER", "ADMIN"]
      parameters:
        - { $ref: "#/components/parameters/ContentVillageId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLandmarkRequest" }
            examples:
              minimal:
                summary: "Required fields only"
                value: { nameAr: "عين البلد", landmarkType: "SPRING", sourceId: "33333333-3333-4333-8333-333333333333" }
              withCoordinates:
                summary: "Both numeric coordinates and optional text"
                value:
                  nameAr: "عين البلد"
                  nameEn: "Village Spring"
                  landmarkType: "SPRING"
                  description: "A documented spring."
                  latitude: 32.123456
                  longitude: 35.654321
                  sourceId: "33333333-3333-4333-8333-333333333333"
      responses:
        "201":
          description: "Created landmark after the transaction and audit log have committed."
          headers:
            X-Request-Id:
              description: "Request correlation ID."
              schema: { type: "string" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandmarkResponse" }
              example:
                data:
                  id: "22222222-2222-4222-8222-222222222222"
                  villageId: "11111111-1111-4111-8111-111111111111"
                  nameAr: "عين البلد"
                  nameEn: null
                  landmarkType: "SPRING"
                  description: null
                  latitude: null
                  longitude: null
                  sourceId: "33333333-3333-4333-8333-333333333333"
                  verificationStatus: "PENDING"
                  version: 1
                  createdAt: "2026-10-10T00:00:00.000Z"
                  updatedAt: "2026-10-10T00:00:00.000Z"
        "400": { $ref: "#/components/responses/LandmarkCreateValidationError" }
        "401": { $ref: "#/components/responses/LandmarkUnauthorized" }
        "403": { $ref: "#/components/responses/LandmarkForbidden" }
        "404": { $ref: "#/components/responses/LandmarkReferenceNotFound" }
        "413": { $ref: "#/components/responses/LandmarkPayloadTooLarge" }
        "429": { $ref: "#/components/responses/ContentTooManyRequests" }
        "500": { $ref: "#/components/responses/ContentInternalError" }
  /api/v1/landmarks/{id}:
    get:
      tags: ["Landmarks"]
      operationId: "getLandmark"
      summary: "Get a landmark"
      description: "Only non-deleted records belonging to a non-deleted village are visible. PENDING, VERIFIED and REJECTED records are public. Source deletion does not hide records."
      security: []
      parameters:
        - { $ref: "#/components/parameters/ContentId" }
      responses:
        "200":
          description: "The landmark."
          headers:
            X-Request-Id:
              description: "Request correlation ID."
              schema: { type: "string" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandmarkResponse" }
              example:
                data:
                  id: "22222222-2222-4222-8222-222222222222"
                  villageId: "11111111-1111-4111-8111-111111111111"
                  nameAr: "عين البلد"
                  nameEn: null
                  landmarkType: "SPRING"
                  description: null
                  latitude: null
                  longitude: null
                  sourceId: null
                  verificationStatus: "PENDING"
                  version: 1
                  createdAt: "2026-10-10T00:00:00.000Z"
                  updatedAt: "2026-10-10T00:00:00.000Z"
        "400": { $ref: "#/components/responses/ContentIdValidationError" }
        "404": { $ref: "#/components/responses/LandmarkNotFound" }
        "429": { $ref: "#/components/responses/ContentTooManyRequests" }
        "500": { $ref: "#/components/responses/ContentInternalError" }
components:
  parameters:
    ContentVillageId:
      name: "villageId"
      in: "path"
      required: true
      description: "Village UUID; slugs are not accepted."
      schema: { type: "string", format: "uuid" }
      example: "11111111-1111-4111-8111-111111111111"
    ContentId:
      name: "id"
      in: "path"
      required: true
      description: "Resource UUID."
      schema: { type: "string", format: "uuid" }
      example: "22222222-2222-4222-8222-222222222222"
    ContentPage:
      name: "page"
      in: "query"
      description: "Positive integer. Defaults to 1."
      schema: { type: "integer", minimum: 1, default: 1 }
      example: 1
    ContentLimit:
      name: "limit"
      in: "query"
      description: "Positive integer. Values above 100 are accepted and capped at 100; defaults to 20."
      schema: { type: "integer", minimum: 1, default: 20 }
      example: 20
    ContentVerificationStatus:
      name: "verificationStatus"
      in: "query"
      description: "Exact, case-sensitive status. Omit to include all three statuses."
      schema: { $ref: "#/components/schemas/ContentVerificationStatus" }
    ContentOrder:
      name: "order"
      in: "query"
      description: "Sort direction; ties always use ID ascending."
      schema:
        type: "string"
        enum: ["asc", "desc"]
        default: "asc"
  schemas:
    ContentVerificationStatus:
      type: "string"
      enum: ["PENDING", "VERIFIED", "REJECTED"]
    ContentPaginationMeta:
      type: "object"
      required: ["page", "limit", "total", "totalPages", "hasNextPage", "hasPrevPage"]
      properties:
        page: { type: "integer", minimum: 1, description: "Requested page, including when it is beyond the last result." }
        limit: { type: "integer", minimum: 1, maximum: 100, description: "Effective page size after the cap." }
        total: { type: "integer", minimum: 0, description: "Total matching visible records before pagination." }
        totalPages: { type: "integer", minimum: 0, description: "Zero when total is zero; otherwise ceil(total / limit)." }
        hasNextPage: { type: "boolean", description: "Whether page is less than totalPages." }
        hasPrevPage: { type: "boolean", description: "Whether page is greater than 1, even when no results match." }
    ContentErrorDetail:
      type: "object"
      required: ["field", "message"]
      properties:
        field: { type: "string", description: "Validation location, such as params.villageId, query.page or body.sourceId." }
        message: { type: "string" }
    ContentErrorResponse:
      type: "object"
      required: ["error"]
      properties:
        error:
          type: "object"
          required: ["code", "message", "details", "requestId"]
          properties:
            code: { type: "string" }
            message: { type: "string" }
            details:
              type: "array"
              items: { $ref: "#/components/schemas/ContentErrorDetail" }
            requestId: { type: "string", description: "Also returned in the X-Request-Id response header." }
            stack: { type: "string", description: "Optional stack trace on HTTP 500 errors in development only." }
    LandmarkType:
      type: "string"
      enum: ["HERITAGE_SITE", "ARCHAEOLOGICAL", "TRADITIONAL_BUILDING", "SPRING", "RELIGIOUS", "VIEWPOINT", "OTHER"]
    Landmark:
      type: "object"
      required: ["id", "villageId", "nameAr", "nameEn", "landmarkType", "description", "latitude", "longitude", "sourceId", "verificationStatus", "version", "createdAt", "updatedAt"]
      properties:
        id: { type: "string", format: "uuid" }
        villageId: { type: "string", format: "uuid" }
        nameAr: { type: "string" }
        nameEn: { type: "string", nullable: true }
        landmarkType: { $ref: "#/components/schemas/LandmarkType" }
        description: { type: "string", nullable: true }
        latitude: { type: "number", nullable: true, description: "JSON number converted from a database Decimal." }
        longitude: { type: "number", nullable: true, description: "JSON number converted from a database Decimal." }
        sourceId: { type: "string", format: "uuid", nullable: true, description: "Source identifier only; no source object is embedded." }
        verificationStatus: { $ref: "#/components/schemas/ContentVerificationStatus" }
        version: { type: "integer" }
        createdAt: { type: "string", format: "date-time" }
        updatedAt: { type: "string", format: "date-time" }
      description: "Public representation shared by list and detail responses. Nullable properties are returned as null; creator/updater IDs and deletedAt are not exposed."
      example:
        id: "22222222-2222-4222-8222-222222222222"
        villageId: "11111111-1111-4111-8111-111111111111"
        nameAr: "عين البلد"
        nameEn: null
        landmarkType: "SPRING"
        description: null
        latitude: null
        longitude: null
        sourceId: null
        verificationStatus: "PENDING"
        version: 1
        createdAt: "2026-10-10T00:00:00.000Z"
        updatedAt: "2026-10-10T00:00:00.000Z"
    LandmarkResponse:
      type: "object"
      required: ["data"]
      properties:
        data: { $ref: "#/components/schemas/Landmark" }
    LandmarkListResponse:
      type: "object"
      required: ["data", "meta"]
      properties:
        data:
          type: "array"
          items: { $ref: "#/components/schemas/Landmark" }
        meta: { $ref: "#/components/schemas/ContentPaginationMeta" }
    CreateLandmarkRequest:
      type: "object"
      additionalProperties: false
      required: ["nameAr", "landmarkType", "sourceId"]
      description: "Unknown fields are rejected, including villageId, metadata and verification fields. String lengths apply after trimming. Coordinates must both be numbers, or each must be omitted/null (one null and the other omitted is valid). Omitted optional fields are returned as null."
      properties:
        nameAr: { type: "string", minLength: 1, maxLength: 200, description: "Trimmed; must be nonblank." }
        nameEn: { type: "string", minLength: 1, maxLength: 200, description: "Optional trimmed nonblank text. Null is not accepted." }
        landmarkType: { $ref: "#/components/schemas/LandmarkType" }
        description: { type: "string", maxLength: 5000, description: "Trimmed; empty string is allowed. Null is not accepted." }
        latitude: { type: "number", minimum: -90, maximum: 90, nullable: true }
        longitude: { type: "number", minimum: -180, maximum: 180, nullable: true }
        sourceId: { type: "string", format: "uuid", description: "Required non-deleted source; any verification status is accepted." }
      oneOf:
        - required: ["latitude", "longitude"]
          properties:
            latitude: { type: "number", minimum: -90, maximum: 90 }
            longitude: { type: "number", minimum: -180, maximum: 180 }
        - properties:
            latitude:
              type: "number"
              nullable: true
              enum: [null]
            longitude:
              type: "number"
              nullable: true
              enum: [null]
  responses:
    ContentValidationError:
      description: "Invalid path or query parameters (VALIDATION_ERROR); malformed JSON is INVALID_JSON when a JSON body is sent."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - { field: "params.villageId", message: "Invalid UUID" }
              requestId: "example-request-123"
    ContentVillageNotFound:
      description: "Village does not exist or is soft-deleted."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "NOT_FOUND"
              message: "Village not found"
              details: []
              requestId: "example-request-123"
    ContentInternalError:
      description: "Unexpected database or application failure. Production responses do not expose internal error details."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "Internal server error"
              details: []
              requestId: "example-request-123"
    ContentTooManyRequests:
      description: "Global rate limit exceeded when rate limiting is enabled."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
        Retry-After:
          description: "Seconds until retry."
          schema: { type: "integer" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "TOO_MANY_REQUESTS"
              message: "Too many requests; please try again later"
              details: []
              requestId: "example-request-123"
    LandmarkNotFound:
      description: "Resource is missing, soft-deleted, or belongs to a soft-deleted village."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "NOT_FOUND"
              message: "Landmark not found"
              details: []
              requestId: "example-request-123"
    LandmarkCreateValidationError:
      description: "Invalid village UUID or JSON body, unknown fields, blank names, invalid enum/source UUID, out-of-range or unpaired coordinates (VALIDATION_ERROR). Malformed JSON returns INVALID_JSON."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - { field: "body.longitude", message: "Latitude and longitude must both be numbers or both be omitted/null" }
              requestId: "example-request-123"
    LandmarkUnauthorized:
      description: "Missing, malformed, invalid or expired Bearer access token. Tokens whose role is outside the current Role enum are also rejected with 401."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Authentication required"
              details: []
              requestId: "example-request-123"
    LandmarkForbidden:
      description: "Role authorization guard rejection. EDITOR, REVIEWER and ADMIN are all allowed, covering every currently supported role; ordinary valid tokens therefore do not reach this response."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "FORBIDDEN"
              message: "You do not have permission to perform this action"
              details: []
              requestId: "example-request-123"
    LandmarkReferenceNotFound:
      description: "Village or source is missing or soft-deleted. Village is checked first; both references are rechecked under transaction locks."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          examples:
            village:
              value:
                error:
                  code: "NOT_FOUND"
                  message: "Village not found"
                  details: []
                  requestId: "example-request-123"
            source:
              value:
                error:
                  code: "NOT_FOUND"
                  message: "Source not found"
                  details: []
                  requestId: "example-request-123"
    LandmarkPayloadTooLarge:
      description: "JSON request body exceeds the application parser's 1 MB limit."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "PAYLOAD_TOO_LARGE"
              message: "Request body is too large"
              details: []
              requestId: "example-request-123"
    ContentIdValidationError:
      description: "Invalid resource UUID (VALIDATION_ERROR)."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - { field: "params.id", message: "Invalid UUID" }
              requestId: "example-request-123"
  securitySchemes:
    LandmarkBearerAuth: { type: "http", scheme: "bearer", bearerFormat: "JWT", description: "Access token supplied as Authorization: Bearer <accessToken>." }
