openapi: "3.0.3"
info:
  title: Qaryati API - Population Records
  version: "1.0.0"
  description: Population record read, create, update, review, and soft-delete endpoints. Paths include the API prefix.
servers:
  - url: /
paths:
  /api/v1/villages/{villageId}/population-records:
    post:
      operationId: createVillagePopulationRecord
      summary: Create a population record
      description: >-
        Requires an EDITOR, REVIEWER or ADMIN bearer token. The village and source
        must be active; any source verification status is accepted. A new record is
        PENDING, version 1 and not preferred. Duplicate village/year/source records,
        including soft-deleted records, produce a conflict. Creation and audit logging
        are atomic. Reference date need not match the reference year. needsReview is
        calculated by comparing population with the non-deleted VERIFIED record for
        the village with the highest reference year (ties use ascending record ID).
        The baseline is the one visible to the lookup statement in the transaction;
        concurrent changes may alter the latest baseline before commit.
        A difference greater than 50% is flagged; no baseline means false. An invalid
        non-positive baseline is flagged for review.
      security:
        - bearerAuth: []
      parameters:
        - name: villageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePopulationRecord' }
            example: { population: 1000, referenceYear: 2020, sourceId: '11111111-1111-4111-8111-111111111111', isEstimate: true, notes: Fictional example }
      responses:
        '201':
          description: Population record created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PopulationRecord' }
              example: &populationResponse
                data: { id: '33333333-3333-4333-8333-333333333333', villageId: '22222222-2222-4222-8222-222222222222', population: 1000, referenceYear: 2020, referenceDate: null, sourceId: '11111111-1111-4111-8111-111111111111', isEstimate: true, isPreferred: false, needsReview: false, notes: Fictional example, verificationStatus: PENDING, version: 1, createdAt: '2026-01-01T10:00:00.000Z', updatedAt: '2026-01-01T10:00:00.000Z' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    get:
      operationId: listVillagePopulationRecords
      summary: List population records for a village
      description: >-
        Returns active records for an active village, including records whose source is
        soft-deleted and records of all verification statuses. By default only preferred
        records are returned; this changes the result for callers that previously omitted
        isPreferred. No fallback is selected for a year without a preferred record.
        Use includeAll=true for all eligible records, or isPreferred=true or false to
        select that flag. includeAll=false preserves the default or explicit isPreferred
        filter; includeAll=true combined with isPreferred returns 400. All filters are
        combined and pagination totals count only matching records. Unknown query keys are
        ignored. A valid page beyond the last result returns an empty array. An
        effective pagination offset exceeding 2147483647 returns HTTP 400. The
        count and page are read from the same database snapshot.
      security: []
      parameters:
        - name: villageId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Values above 100 are capped at 100.
          schema: { type: integer, minimum: 1, default: 20 }
        - name: referenceYear
          in: query
          description: Signed 32-bit exact-match read filter; this is not the valid range for writing population records (1800–2100).
          schema: { type: integer, format: int32 }
        - name: sourceId
          in: query
          schema: { type: string, format: uuid }
        - name: isEstimate
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: isPreferred
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: includeAll
          in: query
          description: Return both preference values when true; cannot be combined with isPreferred when true.
          schema: { type: string, enum: ["true", "false"] }
        - name: needsReview
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: verificationStatus
          in: query
          schema: { $ref: '#/components/schemas/VerificationStatus' }
        - name: sort
          in: query
          description: ID ascending is appended as a stable tie-breaker.
          schema: { type: string, enum: [referenceYear, population, createdAt, updatedAt], default: referenceYear }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Page of population records.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PopulationRecord' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
              example:
                data:
                  - { id: '33333333-3333-4333-8333-333333333333', villageId: '22222222-2222-4222-8222-222222222222', population: 1000, referenceYear: 2020, referenceDate: null, sourceId: '11111111-1111-4111-8111-111111111111', isEstimate: true, isPreferred: true, needsReview: false, notes: Fictional example, verificationStatus: PENDING, version: 1, createdAt: '2026-01-01T10:00:00.000Z', updatedAt: '2026-01-01T10:00:00.000Z' }
                meta: { page: 1, limit: 20, total: 1, totalPages: 1, hasNextPage: false, hasPrevPage: false }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/population-records/{id}:
    delete:
      operationId: deletePopulationRecord
      summary: Soft-delete a population record
      description: >-
        ADMIN only, regardless of ownership or verification status. No request body
        or version is required; a successfully parsed body is ignored. Sets deletedAt and
        updatedById and clears isPreferred without changing version or selecting a
        replacement. Other data and the village/year/source uniqueness reservation
        remain intact. Deletion and audit are atomic. A missing or deleted record or
        inactive parent village returns 404. The first successful deletion can return
        200; after its transaction commits, a later contender returns 404. This
        unversioned operation does not detect stale client versions. The global JSON
        parser can return 400 for malformed JSON or 413 for an oversized JSON body
        before route-level authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Population record soft-deleted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, version, deletedAt]
                    properties:
                      id: { type: string, format: uuid }
                      version: { type: integer }
                      deletedAt: { type: string, format: date-time }
              example:
                data: { id: '33333333-3333-4333-8333-333333333333', version: 4, deletedAt: '2026-01-01T14:00:00.000Z' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updatePopulationRecord
      summary: Update a population record
      description: >-
        EDITOR may edit their own PENDING records; REVIEWER and ADMIN may edit
        PENDING or VERIFIED records. VERIFIED status is preserved. Direct edits to
        REJECTED records are provisionally prohibited. An unchanged deleted source may be retained; a replacement source
        must be active. Record authorization is checked before a missing or deleted
        replacement source is reported. Matching no-ops do not increment version or create an audit.
        A matching no-op succeeds at version 2147483647; an actual change at that
        version returns 409 CONFLICT. Other changes and their audit are atomic. Conflicts include stale versions,
        concurrent changes, and positively identified uniqueness conflicts. Provisionally,
        changing population compares it with the latest other non-deleted VERIFIED record
        for the village using the CREATE threshold; a flag once set remains set. With no
        baseline no new flag is raised; an invalid baseline raises it. Year-only and
        other edits preserve the flag. Clients cannot set needsReview through PATCH.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePopulationRecord' }
            example: { expectedVersion: 1, notes: Updated fictional example }
      responses:
        '200':
          description: Updated or unchanged population record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PopulationRecord' }
              example:
                data: { id: '33333333-3333-4333-8333-333333333333', villageId: '22222222-2222-4222-8222-222222222222', population: 1000, referenceYear: 2020, referenceDate: null, sourceId: '11111111-1111-4111-8111-111111111111', isEstimate: true, isPreferred: false, needsReview: false, notes: Updated fictional example, verificationStatus: PENDING, version: 2, createdAt: '2026-01-01T10:00:00.000Z', updatedAt: '2026-01-01T11:00:00.000Z' }
        '400': { $ref: '#/components/responses/UpdateValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    get:
      operationId: getPopulationRecord
      summary: Get a population record
      description: Returns an active record belonging to an active village, regardless of source deletion or verification status.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Population record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PopulationRecord' }
              example: *populationResponse
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/population-records/{id}/preferred:
    post:
      operationId: selectPreferredPopulationRecord
      summary: Select the preferred population record for a village and year
      description: >-
        REVIEWER or ADMIN only. The caller supplies the target version and the
        preferred slot it observed: null if empty, otherwise the current preferred
        record ID and version. Only an active VERIFIED target is eligible. These
        eligibility and slot-token rules are Population module policies, not explicit
        team-guide requirements. A matching already-preferred selection is a no-op.
        A replacement atomically clears the old preference, sets the target,
        increments each changed version once, records updatedById and an UPDATE
        audit for each. A deleted source is allowed; an inactive village is not.
        Conflicts include stale target or slot versions, an ineligible target,
        concurrent slot changes, a deleted preferred index occupant, and recognized
        preferred-index or database concurrency conflicts. No selection is retried.
        An actual change returns 409 CONFLICT if either row to be changed is at
        version 2147483647; a matching no-op succeeds at that version. The global JSON parser can return
        400 or 413 before route-level authentication. READ defaults are unchanged.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectPreferredPopulationRecord' }
      responses:
        '200':
          description: Selected or unchanged public Population record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PopulationRecord' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/population-records/{id}/verify:
    post:
      operationId: verifyPopulationRecord
      summary: Verify a population record
      description: &reviewDescription >-
        REVIEWER or ADMIN only. The body must contain only expectedVersion.
        PENDING and REJECTED can transition to VERIFIED; PENDING and VERIFIED
        can transition to REJECTED. Repeating the current status with a matching
        version is a no-op with no update or audit; a stale version returns 409
        even for a no-op. A transition increments version once and is audited
        atomically. Verification sets verifiedById and verifiedAt and preserves
        isPreferred. Rejection clears those verification fields and isPreferred
        without selecting a replacement. Preserving needsReview and clearing
        preferred on rejection are Population module policies; these are not
        explicit team-guide rules. An active village is required; a deleted source
        is permitted. Authentication and role checks precede route validation;
        the global JSON parser may return 400 or 413 before authentication.
        A transition at version 2147483647 returns 409 CONFLICT; a matching
        same-status no-op succeeds at that version.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: &reviewBody
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewPopulationRecord' }
            example: { expectedVersion: 2 }
      responses: &reviewResponses
        '200':
          description: Updated or unchanged public Population record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PopulationRecord' }
              examples:
                verified:
                  summary: Verified record
                  value:
                    data: { id: '33333333-3333-4333-8333-333333333333', villageId: '22222222-2222-4222-8222-222222222222', population: 1000, referenceYear: 2020, referenceDate: null, sourceId: '11111111-1111-4111-8111-111111111111', isEstimate: true, isPreferred: false, needsReview: false, notes: Updated fictional example, verificationStatus: VERIFIED, version: 3, createdAt: '2026-01-01T10:00:00.000Z', updatedAt: '2026-01-01T12:00:00.000Z' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/population-records/{id}/reject:
    post:
      operationId: rejectPopulationRecord
      summary: Reject a population record
      description: *reviewDescription
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewPopulationRecord' }
            example: { expectedVersion: 3 }
      responses:
        '200':
          description: Rejected or unchanged public Population record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PopulationRecord' }
              example:
                data: { id: '33333333-3333-4333-8333-333333333333', villageId: '22222222-2222-4222-8222-222222222222', population: 1000, referenceYear: 2020, referenceDate: null, sourceId: '11111111-1111-4111-8111-111111111111', isEstimate: true, isPreferred: false, needsReview: false, notes: Updated fictional example, verificationStatus: REJECTED, version: 4, createdAt: '2026-01-01T10:00:00.000Z', updatedAt: '2026-01-01T13:00:00.000Z' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    SelectPreferredPopulationRecord:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedPreferred]
      properties:
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        expectedPreferred:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1, maximum: 2147483647 }
    ReviewPopulationRecord:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
    UpdatePopulationRecord:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        population: { type: integer, minimum: 1, maximum: 2147483647 }
        referenceYear: { type: integer, minimum: 1800, maximum: 2100 }
        sourceId: { type: string, format: uuid }
        referenceDate: { type: string, format: date-time, nullable: true }
        isEstimate: { type: boolean }
        notes: { type: string, maxLength: 5000, nullable: true, description: Trimmed before length validation. }
    CreatePopulationRecord:
      type: object
      additionalProperties: false
      required: [population, referenceYear, sourceId]
      properties:
        population: { type: integer, minimum: 1, maximum: 2147483647 }
        referenceYear: { type: integer, minimum: 1800, maximum: 2100 }
        sourceId: { type: string, format: uuid }
        referenceDate: { type: string, format: date-time, nullable: true }
        isEstimate: { type: boolean, default: false }
        notes: { type: string, maxLength: 5000, nullable: true, description: Trimmed before length validation. }
    VerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]
    PopulationRecord:
      type: object
      required: [id, villageId, population, referenceYear, referenceDate, sourceId, isEstimate, isPreferred, needsReview, notes, verificationStatus, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        villageId: { type: string, format: uuid }
        population: { type: integer, format: int32 }
        referenceYear: { type: integer, format: int32 }
        referenceDate: { type: string, format: date-time, nullable: true }
        sourceId: { type: string, format: uuid, description: Retained even when the source is soft-deleted. }
        isEstimate: { type: boolean }
        isPreferred: { type: boolean }
        needsReview: { type: boolean }
        notes: { type: string, nullable: true }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPrevPage]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
        hasPrevPage: { type: boolean }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
            requestId: { type: string }
  responses:
    ValidationError:
      description: Invalid path parameters, query parameters, or request body.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UpdateValidationError:
      description: Invalid path parameters or request body; the example omits editable fields.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: VALIDATION_ERROR, message: Request validation failed, details: [{ field: body, message: At least one editable field is required }], requestId: example-request-400 }
    VersionConflict:
      description: Conflict, including a stale expected version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: CONFLICT, message: Population record version conflict, details: [], requestId: example-request-409 }
    PayloadTooLarge:
      description: JSON request body exceeds the global 1 MB limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: PAYLOAD_TOO_LARGE, message: Request body is too large, details: [], requestId: example-request-413 }
    NotFound:
      description: Village, source, or record is missing or soft-deleted, or the record belongs to a soft-deleted village.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Error:
      description: Authentication, authorization, conflict, rate limit, or unexpected application error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
