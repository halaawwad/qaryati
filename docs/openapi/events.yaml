openapi: "3.0.3"
info: {"title":"Qaryati API - Historical Events","version":"1.1.0","description":"Public GET and authenticated POST/PATCH/DELETE APIs. Paths include /api/v1. Every response carries X-Request-Id. All operations are subject to the global rate limit. See docs/events.md."}
servers:
  - { url: "/", description: "Current API origin; replace with the target server origin when importing." }
tags:
  - { name: "Historical Events", description: "Historical Events APIs." }
x-implementation-source: { module: "src/modules/events/", tests: "tests/events*.test.ts" }
paths:
  /api/v1/villages/{villageId}/events:
    post:
      "tags": ["Historical Events"]
      "operationId": "createHistoricalEvent"
      "summary": "Create a historical event"
      "description": "EDITOR, REVIEWER and ADMIN may create. Requires an active village; optional non-null sourceId must reference an active source, regardless of source verification status. Creates PENDING/version 1 with creator/updater from the token and exactly one HistoricalEvent CREATE audit in the same transaction."
      "security": [{"EventsBearerAuth":[]}]
      "x-allowed-roles": ["EDITOR","REVIEWER","ADMIN"]
      "parameters": [{"$ref":"#/components/parameters/ContentVillageId"}]
      "responses":
        "201":
          "description": "Created event: PENDING, server-assigned version 1."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HistoricalEventResponse"
        "400":
          "description": "VALIDATION_ERROR: invalid village UUID, missing/invalid title, invalid dates/types/ranges or unknown/protected fields. Malformed JSON returns INVALID_JSON."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "401":
          "description": "UNAUTHORIZED: missing, invalid, expired or unsupported-role bearer token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "403":
          "description": "FORBIDDEN if the authenticated role is disallowed. All current roles may create without ownership restrictions. Unsupported token roles return 401."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "404":
          "description": "NOT_FOUND: missing/deleted village or supplied source."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "413":
          "description": "PAYLOAD_TOO_LARGE: supplied JSON body exceeds the global 1 MB limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "429":
          "description": "TOO_MANY_REQUESTS: global rate limit exceeded when enabled."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "500":
          "description": "INTERNAL_ERROR: unexpected database/audit failure. Audit failure rolls back writes; internal details hidden in production."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateEventRequest"
    get:
      tags: ["Historical Events"]
      operationId: "listVillageHistoricalEvents"
      summary: "List a village's historical events"
      description: "Only non-deleted records belonging to a non-deleted village are visible. PENDING, VERIFIED and REJECTED records are public. Source deletion does not hide records. A missing or deleted village returns 404. An active village without matches, or a page beyond the results, returns 200 with an empty data array. Unknown query keys are stripped and ignored."
      security: []
      parameters:
        - { $ref: "#/components/parameters/ContentVillageId" }
        - { $ref: "#/components/parameters/ContentPage" }
        - { $ref: "#/components/parameters/ContentLimit" }
        - name: "search"
          in: "query"
          description: "Case-insensitive literal contains search across title and description. Trimmed; blank text is ignored. Percent signs, underscores and backslashes are escaped for literal matching."
          schema: { type: "string", maxLength: 100 }
          example: "heritage"
        - name: "category"
          in: "query"
          description: "Case-insensitive exact match after trimming (not substring search). Literal %, _ and backslash are escaped. Blank values are rejected; category is free text, not an enum."
          schema: { type: "string", minLength: 1, maxLength: 100 }
          example: "Heritage"
        - { $ref: "#/components/parameters/ContentVerificationStatus" }
        - name: "isApproximate"
          in: "query"
          description: "Only the lowercase strings true and false are accepted; omission leaves the filter unrestricted."
          schema:
            type: "string"
            enum: ["true", "false"]
          example: "false"
        - name: "yearFrom"
          in: "query"
          description: "Inclusive lower bound on stored eventYear. Null years are excluded when either bound is set. No fallback to eventDate. Negative years and zero are accepted; blank values are rejected. If both bounds are set, yearFrom must be <= yearTo."
          schema: { type: "integer", format: "int32", minimum: -2147483648, maximum: 2147483647 }
          example: 1900
        - name: "yearTo"
          in: "query"
          description: "Inclusive upper bound on stored eventYear. Null years are excluded when either bound is set. No fallback to eventDate. Negative years and zero are accepted; blank values are rejected. If both bounds are set, yearFrom must be <= yearTo."
          schema: { type: "integer", format: "int32", minimum: -2147483648, maximum: 2147483647 }
          example: 2026
        - name: "sort"
          in: "query"
          description: "Primary sort field. ID ascending is always appended as a stable tie-breaker. Null eventYear and eventDate values sort last in either direction."
          schema:
            type: "string"
            enum: ["eventYear", "eventDate", "title", "createdAt"]
            default: "eventYear"
        - { $ref: "#/components/parameters/ContentOrder" }
      responses:
        "200":
          description: "A page of historical events."
          headers:
            X-Request-Id:
              description: "Request correlation ID."
              schema: { type: "string" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricalEventListResponse" }
              examples:
                page:
                  summary: "One matching record"
                  value:
                    data:
                      - id: "22222222-2222-4222-8222-222222222222"
                        villageId: "11111111-1111-4111-8111-111111111111"
                        title: "حدث تاريخي"
                        description: null
                        eventYear: null
                        eventDate: "2014-06-20T00:00:00.000Z"
                        isApproximate: false
                        category: null
                        sourceId: null
                        verificationStatus: "PENDING"
                        version: 1
                        createdAt: "2026-10-10T00:00:00.000Z"
                        updatedAt: "2026-10-10T00:00:00.000Z"
                    meta:
                      page: 1
                      limit: 20
                      total: 1
                      totalPages: 1
                      hasNextPage: false
                      hasPrevPage: false
                empty:
                  summary: "No matching records on page 1"
                  value:
                    data: []
                    meta:
                      page: 1
                      limit: 20
                      total: 0
                      totalPages: 0
                      hasNextPage: false
                      hasPrevPage: false
        "400": { $ref: "#/components/responses/ContentValidationError" }
        "404": { $ref: "#/components/responses/ContentVillageNotFound" }
        "429": { $ref: "#/components/responses/ContentTooManyRequests" }
        "500": { $ref: "#/components/responses/ContentInternalError" }
  /api/v1/events/{id}:
    delete:
      "tags": ["Historical Events"]
      "operationId": "deleteHistoricalEvent"
      "summary": "Soft delete a historical event"
      "description": "ADMIN only. No request body. Sets deletedAt/updater and preserves the physical row, version and relationships. Locks the event before reading its audit snapshot. One HistoricalEvent DELETE audit commits atomically. Public GET/list exclude deleted events. Repeated deletion returns 404."
      "security": [{"EventsBearerAuth":[]}]
      "x-allowed-roles": ["ADMIN"]
      "parameters": [{"$ref":"#/components/parameters/ContentId"}]
      "responses":
        "204":
          "description": "Event soft-deleted; empty response body."
        "400":
          "description": "VALIDATION_ERROR: invalid event UUID. If a JSON body is supplied, the global parser rejects malformed JSON with INVALID_JSON; this operation has no request body."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "401":
          "description": "UNAUTHORIZED: missing, invalid, expired or unsupported-role bearer token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "403":
          "description": "FORBIDDEN: EDITOR and REVIEWER cannot delete, regardless of ownership/status."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "404":
          "description": "NOT_FOUND: missing/deleted event or parent village, including repeated deletion."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "413":
          "description": "PAYLOAD_TOO_LARGE: supplied JSON body exceeds the global 1 MB limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "429":
          "description": "TOO_MANY_REQUESTS: global rate limit exceeded when enabled."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "500":
          "description": "INTERNAL_ERROR: unexpected database/audit failure. Audit failure rolls back writes; internal details hidden in production."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
    patch:
      "tags": ["Historical Events"]
      "operationId": "updateHistoricalEvent"
      "summary": "Partially update a historical event"
      "description": "EDITOR may edit only their own PENDING event; REVIEWER and ADMIN may edit any active event. Requires current version plus an editable field. Omitted fields are preserved. A changed non-null sourceId is revalidated; null removes the source link. Every accepted edit resets PENDING, increments version once, sets updater and records exactly one HistoricalEvent UPDATE audit with before/after snapshots atomically."
      "security": [{"EventsBearerAuth":[]}]
      "x-allowed-roles": ["EDITOR","REVIEWER","ADMIN"]
      "parameters": [{"$ref":"#/components/parameters/ContentId"}]
      "responses":
        "200":
          "description": "Updated event: PENDING, version incremented exactly once."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HistoricalEventResponse"
        "400":
          "description": "VALIDATION_ERROR: invalid UUID, missing/invalid version, no editable fields, invalid dates/types/ranges or unknown/protected fields. Malformed JSON returns INVALID_JSON."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "401":
          "description": "UNAUTHORIZED: missing, invalid, expired or unsupported-role bearer token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "403":
          "description": "EVENT_EDIT_FORBIDDEN: EDITOR does not own the PENDING event, including no creator. CHANGE_REQUEST_REQUIRED: EDITOR edits a non-PENDING event. FORBIDDEN: disallowed role."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "404":
          "description": "NOT_FOUND: missing/deleted event, parent village or newly selected source. An unchanged source is not revalidated."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "409":
          "description": "VERSION_CONFLICT: stale version, including concurrent updates. Reload before retrying; details contain the current version."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "413":
          "description": "PAYLOAD_TOO_LARGE: supplied JSON body exceeds the global 1 MB limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "429":
          "description": "TOO_MANY_REQUESTS: global rate limit exceeded when enabled."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "500":
          "description": "INTERNAL_ERROR: unexpected database/audit failure. Audit failure rolls back writes; internal details hidden in production."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/UpdateEventRequest"
    get:
      tags: ["Historical Events"]
      operationId: "getHistoricalEvent"
      summary: "Get a historical event"
      description: "Only non-deleted records belonging to a non-deleted village are visible. PENDING, VERIFIED and REJECTED records are public. Source deletion does not hide records."
      security: []
      parameters:
        - { $ref: "#/components/parameters/ContentId" }
      responses:
        "200":
          description: "The historical event."
          headers:
            X-Request-Id:
              description: "Request correlation ID."
              schema: { type: "string" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricalEventResponse" }
              example:
                data:
                  id: "22222222-2222-4222-8222-222222222222"
                  villageId: "11111111-1111-4111-8111-111111111111"
                  title: "حدث تاريخي"
                  description: null
                  eventYear: null
                  eventDate: "2014-06-20T00:00:00.000Z"
                  isApproximate: false
                  category: null
                  sourceId: null
                  verificationStatus: "PENDING"
                  version: 1
                  createdAt: "2026-10-10T00:00:00.000Z"
                  updatedAt: "2026-10-10T00:00:00.000Z"
        "400": { $ref: "#/components/responses/ContentIdValidationError" }
        "404": { $ref: "#/components/responses/HistoricalEventNotFound" }
        "429": { $ref: "#/components/responses/ContentTooManyRequests" }
        "500": { $ref: "#/components/responses/ContentInternalError" }
components:
  securitySchemes:
    EventsBearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ContentVillageId:
      name: "villageId"
      in: "path"
      required: true
      description: "Village UUID; slugs are not accepted."
      schema: { type: "string", format: "uuid" }
      example: "11111111-1111-4111-8111-111111111111"
    ContentId:
      name: "id"
      in: "path"
      required: true
      description: "Resource UUID."
      schema: { type: "string", format: "uuid" }
      example: "22222222-2222-4222-8222-222222222222"
    ContentPage:
      name: "page"
      in: "query"
      description: "Positive integer. Defaults to 1."
      schema: { type: "integer", minimum: 1, default: 1 }
      example: 1
    ContentLimit:
      name: "limit"
      in: "query"
      description: "Positive integer. Values above 100 are accepted and capped at 100; defaults to 20."
      schema: { type: "integer", minimum: 1, default: 20 }
      example: 20
    ContentVerificationStatus:
      name: "verificationStatus"
      in: "query"
      description: "Exact, case-sensitive status. Omit to include all three statuses."
      schema: { $ref: "#/components/schemas/ContentVerificationStatus" }
    ContentOrder:
      name: "order"
      in: "query"
      description: "Sort direction; ties always use ID ascending."
      schema:
        type: "string"
        enum: ["asc", "desc"]
        default: "asc"
  schemas:
    CreateEventRequest:
      "type": "object"
      "additionalProperties": false
      "required": ["title"]
      "properties":
        "title":
          "type": "string"
          "minLength": 1
          "maxLength": 200
          "description": "Trimmed; nonblank."
        "description":
          "type": "string"
          "maxLength": 5000
          "nullable": true
          "description": "Trimmed; empty allowed."
        "category":
          "type": "string"
          "minLength": 1
          "maxLength": 100
          "nullable": true
          "description": "Trimmed free text, not an enum; use null to clear."
        "sourceId":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "eventYear":
          "type": "integer"
          "format": "int32"
          "minimum": -2147483648
          "maximum": 2147483647
          "nullable": true
          "description": "Independent historical year; negatives and zero accepted. No year is inferred from eventDate."
        "eventDate":
          "type": "string"
          "format": "date-time"
          "nullable": true
          "description": "Valid ISO date-time with Z or numeric timezone offset; normalized UTC year must be 0001 through 9999. Date-only and timezone-less inputs are rejected. Returned as UTC with millisecond precision. For BCE use eventYear."
        "isApproximate":
          "type": "boolean"
          "default": false
      "description": "Only title is required. Optional nullable fields may be omitted or null. No client version accepted. No date/year consistency, historical-period or title-uniqueness rule is imposed by the model."
    UpdateEventRequest:
      "type": "object"
      "additionalProperties": false
      "required": ["version"]
      "minProperties": 2
      "properties":
        "title":
          "type": "string"
          "minLength": 1
          "maxLength": 200
          "description": "Trimmed; nonblank."
        "description":
          "type": "string"
          "maxLength": 5000
          "nullable": true
          "description": "Trimmed; empty allowed."
        "category":
          "type": "string"
          "minLength": 1
          "maxLength": 100
          "nullable": true
          "description": "Trimmed free text, not an enum; use null to clear."
        "sourceId":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "eventYear":
          "type": "integer"
          "format": "int32"
          "minimum": -2147483648
          "maximum": 2147483647
          "nullable": true
          "description": "Independent historical year; negatives and zero accepted. No year is inferred from eventDate."
        "eventDate":
          "type": "string"
          "format": "date-time"
          "nullable": true
          "description": "Valid ISO date-time with Z or numeric timezone offset; normalized UTC year must be 0001 through 9999. Date-only and timezone-less inputs are rejected. Returned as UTC with millisecond precision. For BCE use eventYear."
        "isApproximate":
          "type": "boolean"
        "version":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483646
      "description": "Current version plus at least one editable field. Omitted fields preserved (including isApproximate). Description, category, sourceId, eventYear and eventDate may be cleared with null."
    ContentVerificationStatus:
      type: "string"
      enum: ["PENDING", "VERIFIED", "REJECTED"]
    ContentPaginationMeta:
      type: "object"
      required: ["page", "limit", "total", "totalPages", "hasNextPage", "hasPrevPage"]
      properties:
        page: { type: "integer", minimum: 1, description: "Requested page, including when it is beyond the last result." }
        limit: { type: "integer", minimum: 1, maximum: 100, description: "Effective page size after the cap." }
        total: { type: "integer", minimum: 0, description: "Total matching visible records before pagination." }
        totalPages: { type: "integer", minimum: 0, description: "Zero when total is zero; otherwise ceil(total / limit)." }
        hasNextPage: { type: "boolean", description: "Whether page is less than totalPages." }
        hasPrevPage: { type: "boolean", description: "Whether page is greater than 1, even when no results match." }
    ContentErrorDetail:
      type: "object"
      required: ["field", "message"]
      properties:
        field: { type: "string", description: "Validation location, such as params.villageId, query.page or body.sourceId." }
        message: { type: "string" }
    ContentErrorResponse:
      type: "object"
      required: ["error"]
      properties:
        error:
          type: "object"
          required: ["code", "message", "details", "requestId"]
          properties:
            code: { type: "string" }
            message: { type: "string" }
            details:
              type: "array"
              items: { $ref: "#/components/schemas/ContentErrorDetail" }
            requestId: { type: "string", description: "Also returned in the X-Request-Id response header." }
            stack: { type: "string", description: "Optional stack trace on HTTP 500 errors in development only." }
    HistoricalEvent:
      type: "object"
      required: ["id", "villageId", "title", "description", "eventYear", "eventDate", "isApproximate", "category", "sourceId", "verificationStatus", "version", "createdAt", "updatedAt"]
      properties:
        id: { type: "string", format: "uuid" }
        villageId: { type: "string", format: "uuid" }
        title: { type: "string" }
        description: { type: "string", nullable: true }
        eventYear:
          type: "integer"
          format: "int32"
          minimum: -2147483648
          maximum: 2147483647
          nullable: true
          description: "Stored year; never inferred from eventDate."
        eventDate: { type: "string", format: "date-time", nullable: true }
        isApproximate: { type: "boolean" }
        category: { type: "string", nullable: true }
        sourceId: { type: "string", format: "uuid", nullable: true, description: "Source identifier only; no source object is embedded." }
        verificationStatus: { $ref: "#/components/schemas/ContentVerificationStatus" }
        version: { type: "integer" }
        createdAt: { type: "string", format: "date-time" }
        updatedAt: { type: "string", format: "date-time" }
      description: "Public representation shared by GET, POST and PATCH responses. Nullable properties are returned as null; creator/updater IDs and deletedAt are not exposed."
      example:
        id: "22222222-2222-4222-8222-222222222222"
        villageId: "11111111-1111-4111-8111-111111111111"
        title: "حدث تاريخي"
        description: null
        eventYear: null
        eventDate: "2014-06-20T00:00:00.000Z"
        isApproximate: false
        category: null
        sourceId: null
        verificationStatus: "PENDING"
        version: 1
        createdAt: "2026-10-10T00:00:00.000Z"
        updatedAt: "2026-10-10T00:00:00.000Z"
    HistoricalEventResponse:
      type: "object"
      required: ["data"]
      properties:
        data: { $ref: "#/components/schemas/HistoricalEvent" }
    HistoricalEventListResponse:
      type: "object"
      required: ["data", "meta"]
      properties:
        data:
          type: "array"
          items: { $ref: "#/components/schemas/HistoricalEvent" }
        meta: { $ref: "#/components/schemas/ContentPaginationMeta" }
  responses:
    ContentValidationError:
      description: "Invalid path or query parameters (VALIDATION_ERROR); malformed JSON is INVALID_JSON when a JSON body is sent."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - { field: "params.villageId", message: "Invalid UUID" }
              requestId: "example-request-123"
    ContentVillageNotFound:
      description: "Village does not exist or is soft-deleted."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "NOT_FOUND"
              message: "Village not found"
              details: []
              requestId: "example-request-123"
    ContentInternalError:
      description: "Unexpected database or application failure. Production responses do not expose internal error details."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "Internal server error"
              details: []
              requestId: "example-request-123"
    ContentTooManyRequests:
      description: "Global rate limit exceeded when rate limiting is enabled."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
        Retry-After:
          description: "Seconds until retry."
          schema: { type: "integer" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "TOO_MANY_REQUESTS"
              message: "Too many requests; please try again later"
              details: []
              requestId: "example-request-123"
    HistoricalEventNotFound:
      description: "Resource is missing, soft-deleted, or belongs to a soft-deleted village."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "NOT_FOUND"
              message: "Historical event not found"
              details: []
              requestId: "example-request-123"
    ContentIdValidationError:
      description: "Invalid resource UUID (VALIDATION_ERROR)."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - { field: "params.id", message: "Invalid UUID" }
              requestId: "example-request-123"
