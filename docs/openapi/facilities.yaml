openapi: "3.0.3"
info: {"title":"Qaryati API - Facilities","version":"1.1.0","description":"Public GET and authenticated POST/PATCH/DELETE APIs. Paths include /api/v1. Every response carries X-Request-Id. All operations are subject to the global rate limit. See docs/facilities.md."}
servers:
  - { url: "/", description: "Current API origin; replace with the target server origin when importing." }
tags:
  - { name: "Facilities", description: "Facilities APIs." }
x-implementation-source: { module: "src/modules/facilities/", tests: "tests/facilities*.test.ts" }
paths:
  /api/v1/villages/{villageId}/facilities:
    post:
      "tags": ["Facilities"]
      "operationId": "createFacility"
      "summary": "Create a facility"
      "description": "EDITOR, REVIEWER and ADMIN may create. Requires active village/source; source verification status is unrestricted. Creates PENDING with server-assigned version 1 and creator/updater from the token. One Facility CREATE audit commits atomically."
      "security": [{"FacilityBearerAuth":[]}]
      "x-allowed-roles": ["EDITOR","REVIEWER","ADMIN"]
      "parameters": [{"$ref":"#/components/parameters/ContentVillageId"}]
      "responses":
        "201":
          "description": "Created facility: PENDING, version 1."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FacilityResponse"
        "400":
          "description": "VALIDATION_ERROR: invalid village UUID, missing name/facilityType/sourceId, invalid values or unknown/protected fields. Malformed JSON returns INVALID_JSON."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "401":
          "description": "UNAUTHORIZED: missing, invalid, expired or unsupported-role bearer token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "403":
          "description": "FORBIDDEN if a role is disallowed. All currently supported roles may create without ownership restrictions. Unsupported token roles return 401."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "404":
          "description": "NOT_FOUND: missing/deleted village or source."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "413":
          "description": "PAYLOAD_TOO_LARGE: supplied JSON body exceeds the global 1 MB limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "429":
          "description": "TOO_MANY_REQUESTS: global rate limit exceeded when enabled."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "500":
          "description": "INTERNAL_ERROR: unexpected database/audit failure; audit failure rolls back writes. Internal details hidden in production."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateFacilityRequest"
    get:
      tags: ["Facilities"]
      operationId: "listVillageFacilities"
      summary: "List a village's facilities"
      description: "Only non-deleted records belonging to a non-deleted village are visible. PENDING, VERIFIED and REJECTED records are public. Source deletion does not hide records. A missing or deleted village returns 404. An active village without matches, or a page beyond the results, returns 200 with an empty data array. Unknown query keys are stripped and ignored. After defaults and the limit cap, (page - 1) * effectiveLimit must be a safe integer no greater than 2147483647; otherwise 400 with field query.page."
      security: []
      parameters:
        - { $ref: "#/components/parameters/ContentVillageId" }
        - { $ref: "#/components/parameters/ContentPage" }
        - { $ref: "#/components/parameters/ContentLimit" }
        - name: "search"
          in: "query"
          description: "Case-insensitive literal contains search across name and description. Leading and trailing whitespace is trimmed before the 100-character limit is checked; blank text is ignored. Percent signs (%), underscores (_) and backslashes are matched literally, not as wildcard or escape syntax supplied by the caller. Send the literal text without adding SQL escapes; URL-encode query values (for example, %25 for a percent sign and %5C for a backslash)."
          schema: { type: "string", maxLength: 100 }
          example: "مدرسة"
        - name: "facilityType"
          in: "query"
          description: "Exact, case-sensitive enum value; whitespace is not trimmed."
          schema: { $ref: "#/components/schemas/FacilityType" }
        - { $ref: "#/components/parameters/ContentVerificationStatus" }
        - name: "asOfYear"
          in: "query"
          description: "Exact match on the stored signed 32-bit integer year. Input is trimmed and converted with Number(), then checked for an integer in range. Negative years and zero are accepted; blank values are rejected. When supplied, records with null asOfYear do not match."
          schema: { type: "integer", format: "int32", minimum: -2147483648, maximum: 2147483647 }
          example: 2014
        - name: "sort"
          in: "query"
          description: "Primary sort field. ID ascending is always appended as a stable tie-breaker. Null asOfYear values sort last in either direction."
          schema:
            type: "string"
            enum: ["name", "asOfYear", "createdAt", "updatedAt"]
            default: "name"
        - { $ref: "#/components/parameters/ContentOrder" }
      responses:
        "200":
          description: "A page of facilities."
          headers:
            X-Request-Id:
              description: "Request correlation ID."
              schema: { type: "string" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityListResponse" }
              examples:
                page:
                  summary: "One matching record"
                  value:
                    data:
                      - id: "22222222-2222-4222-8222-222222222222"
                        villageId: "11111111-1111-4111-8111-111111111111"
                        facilityType: "SCHOOL"
                        name: "مدرسة القرية"
                        description: null
                        asOfYear: null
                        latitude: 32.123456
                        longitude: 0
                        sourceId: null
                        verificationStatus: "PENDING"
                        version: 1
                        createdAt: "2026-10-10T00:00:00.000Z"
                        updatedAt: "2026-10-10T00:00:00.000Z"
                    meta:
                      page: 1
                      limit: 20
                      total: 1
                      totalPages: 1
                      hasNextPage: false
                      hasPrevPage: false
                empty:
                  summary: "No matching records on page 1"
                  value:
                    data: []
                    meta:
                      page: 1
                      limit: 20
                      total: 0
                      totalPages: 0
                      hasNextPage: false
                      hasPrevPage: false
        "400": { $ref: "#/components/responses/ContentValidationError" }
        "404": { $ref: "#/components/responses/ContentVillageNotFound" }
        "429": { $ref: "#/components/responses/ContentTooManyRequests" }
        "500": { $ref: "#/components/responses/ContentInternalError" }
  /api/v1/facilities/{id}:
    delete:
      "tags": ["Facilities"]
      "operationId": "deleteFacility"
      "summary": "Soft delete a facility"
      "description": "ADMIN only. No request body. Sets deletedAt/updater and preserves row, version and relationships. One Facility DELETE audit commits atomically. Locks the row before reading the audit snapshot. Deleted facilities are excluded from public reads. Repeated deletion returns 404."
      "security": [{"FacilityBearerAuth":[]}]
      "x-allowed-roles": ["ADMIN"]
      "parameters": [{"$ref":"#/components/parameters/ContentId"}]
      "responses":
        "204":
          "description": "Soft-deleted; empty response body."
        "400":
          "description": "VALIDATION_ERROR: invalid facility UUID. If a JSON body is sent, the global parser rejects malformed JSON with INVALID_JSON; this operation has no request body."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "401":
          "description": "UNAUTHORIZED: missing, invalid, expired or unsupported-role bearer token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "403":
          "description": "FORBIDDEN: EDITOR and REVIEWER cannot delete regardless of ownership/status."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "404":
          "description": "NOT_FOUND: missing/deleted facility or parent village, including repeated deletion."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "413":
          "description": "PAYLOAD_TOO_LARGE: supplied JSON body exceeds the global 1 MB limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "429":
          "description": "TOO_MANY_REQUESTS: global rate limit exceeded when enabled."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "500":
          "description": "INTERNAL_ERROR: unexpected database/audit failure; audit failure rolls back writes. Internal details hidden in production."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
    patch:
      "tags": ["Facilities"]
      "operationId": "updateFacility"
      "summary": "Partially update a facility"
      "description": "EDITOR may edit only their own PENDING facility; REVIEWER/ADMIN may edit any active facility. Omitted fields are preserved. Revalidate source only when changed. Coordinates must be two numbers or both null to clear, or both omitted to preserve. Every accepted edit resets PENDING, increments version once, sets updater and records one Facility UPDATE audit with before/after snapshots atomically."
      "security": [{"FacilityBearerAuth":[]}]
      "x-allowed-roles": ["EDITOR","REVIEWER","ADMIN"]
      "parameters": [{"$ref":"#/components/parameters/ContentId"}]
      "responses":
        "200":
          "description": "Updated facility: PENDING, version incremented exactly once."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FacilityResponse"
        "400":
          "description": "VALIDATION_ERROR: invalid UUID, missing/invalid version, no editable fields, invalid values, incomplete/mixed-null coordinates or unknown/protected fields. Malformed JSON returns INVALID_JSON."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "401":
          "description": "UNAUTHORIZED: missing, invalid, expired or unsupported-role bearer token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "403":
          "description": "FACILITY_EDIT_FORBIDDEN: EDITOR does not own the PENDING facility, including no creator. CHANGE_REQUEST_REQUIRED: EDITOR edits a non-PENDING facility. FORBIDDEN: disallowed role."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "404":
          "description": "NOT_FOUND: missing/deleted facility, parent village or changed source. Unchanged source is not revalidated."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "409":
          "description": "VERSION_CONFLICT: stale version including concurrent updates; details contain current version. Reload before retrying."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "413":
          "description": "PAYLOAD_TOO_LARGE: supplied JSON body exceeds the global 1 MB limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "429":
          "description": "TOO_MANY_REQUESTS: global rate limit exceeded when enabled."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
        "500":
          "description": "INTERNAL_ERROR: unexpected database/audit failure; audit failure rolls back writes. Internal details hidden in production."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContentErrorResponse"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/UpdateFacilityRequest"
    get:
      tags: ["Facilities"]
      operationId: "getFacility"
      summary: "Get a facility"
      description: "Only non-deleted records belonging to a non-deleted village are visible. PENDING, VERIFIED and REJECTED records are public. Source deletion does not hide records."
      security: []
      parameters:
        - { $ref: "#/components/parameters/ContentId" }
      responses:
        "200":
          description: "The facility, including nullable coordinates."
          headers:
            X-Request-Id:
              description: "Request correlation ID."
              schema: { type: "string" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityResponse" }
              example:
                data:
                  id: "22222222-2222-4222-8222-222222222222"
                  villageId: "11111111-1111-4111-8111-111111111111"
                  facilityType: "SCHOOL"
                  name: "مدرسة القرية"
                  description: null
                  asOfYear: null
                  latitude: null
                  longitude: null
                  sourceId: null
                  verificationStatus: "PENDING"
                  version: 1
                  createdAt: "2026-10-10T00:00:00.000Z"
                  updatedAt: "2026-10-10T00:00:00.000Z"
        "400": { $ref: "#/components/responses/ContentIdValidationError" }
        "404": { $ref: "#/components/responses/FacilityNotFound" }
        "429": { $ref: "#/components/responses/ContentTooManyRequests" }
        "500": { $ref: "#/components/responses/ContentInternalError" }
components:
  securitySchemes:
    FacilityBearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ContentVillageId:
      name: "villageId"
      in: "path"
      required: true
      description: "Village UUID; slugs are not accepted."
      schema: { type: "string", format: "uuid" }
      example: "11111111-1111-4111-8111-111111111111"
    ContentId:
      name: "id"
      in: "path"
      required: true
      description: "Resource UUID."
      schema: { type: "string", format: "uuid" }
      example: "22222222-2222-4222-8222-222222222222"
    ContentPage:
      name: "page"
      in: "query"
      description: "Positive integer. Defaults to 1."
      schema: { type: "integer", minimum: 1, default: 1 }
      example: 1
    ContentLimit:
      name: "limit"
      in: "query"
      description: "Positive integer. Values above 100 are accepted and capped at 100; defaults to 20."
      schema: { type: "integer", minimum: 1, default: 20 }
      example: 20
    ContentVerificationStatus:
      name: "verificationStatus"
      in: "query"
      description: "Exact, case-sensitive status. Omit to include all three statuses."
      schema: { $ref: "#/components/schemas/ContentVerificationStatus" }
    ContentOrder:
      name: "order"
      in: "query"
      description: "Sort direction; ties always use ID ascending."
      schema:
        type: "string"
        enum: ["asc", "desc"]
        default: "asc"
  schemas:
    CreateFacilityRequest:
      "type": "object"
      "additionalProperties": false
      "required": ["name","facilityType","sourceId"]
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
          "description": "Trimmed; nonblank."
        "facilityType":
          "$ref": "#/components/schemas/FacilityType"
        "sourceId":
          "type": "string"
          "format": "uuid"
        "description":
          "type": "string"
          "maxLength": 5000
          "description": "Trimmed; empty allowed."
        "asOfYear":
          "type": "integer"
          "format": "int32"
          "minimum": -2147483648
          "maximum": 2147483647
          "nullable": true
        "latitude":
          "type": "number"
          "minimum": -90
          "maximum": 90
          "nullable": true
        "longitude":
          "type": "number"
          "minimum": -180
          "maximum": 180
          "nullable": true
      "description": "No client version accepted. Description cannot be null. Coordinates must both be numbers, or each may be omitted/null. PostgreSQL stores six decimal places."
      "oneOf": [{"required":["latitude","longitude"],"properties":{"latitude":{"type":"number","minimum":-90,"maximum":90},"longitude":{"type":"number","minimum":-180,"maximum":180}}},{"properties":{"latitude":{"type":"number","nullable":true,"enum":[null]},"longitude":{"type":"number","nullable":true,"enum":[null]}}}]
    UpdateFacilityRequest:
      "type": "object"
      "additionalProperties": false
      "required": ["version"]
      "minProperties": 2
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
          "description": "Trimmed; nonblank."
        "facilityType":
          "$ref": "#/components/schemas/FacilityType"
        "sourceId":
          "type": "string"
          "format": "uuid"
        "description":
          "type": "string"
          "maxLength": 5000
          "description": "Trimmed; empty allowed."
          "nullable": true
        "asOfYear":
          "type": "integer"
          "format": "int32"
          "minimum": -2147483648
          "maximum": 2147483647
          "nullable": true
        "latitude":
          "type": "number"
          "minimum": -90
          "maximum": 90
          "nullable": true
        "longitude":
          "type": "number"
          "minimum": -180
          "maximum": 180
          "nullable": true
        "version":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483646
      "description": "Version plus at least one editable field. Omitted fields preserved. Description/year can be null; source cannot be removed. Coordinates: both numbers, both null, or both omitted. Stored precision is six decimals."
      "oneOf": [{"required":["latitude","longitude"],"properties":{"latitude":{"type":"number","minimum":-90,"maximum":90},"longitude":{"type":"number","minimum":-180,"maximum":180}}},{"properties":{"latitude":{"type":"number","nullable":true,"enum":[null]},"longitude":{"type":"number","nullable":true,"enum":[null]}},"required":["latitude","longitude"]},{"not":{"anyOf":[{"required":["latitude"]},{"required":["longitude"]}]}}]
    ContentVerificationStatus:
      type: "string"
      enum: ["PENDING", "VERIFIED", "REJECTED"]
    ContentPaginationMeta:
      type: "object"
      required: ["page", "limit", "total", "totalPages", "hasNextPage", "hasPrevPage"]
      properties:
        page: { type: "integer", minimum: 1, description: "Requested page, including when it is beyond the last result." }
        limit: { type: "integer", minimum: 1, maximum: 100, description: "Effective page size after the cap." }
        total: { type: "integer", minimum: 0, description: "Total matching visible records before pagination." }
        totalPages: { type: "integer", minimum: 0, description: "Zero when total is zero; otherwise ceil(total / limit)." }
        hasNextPage: { type: "boolean", description: "Whether page is less than totalPages." }
        hasPrevPage: { type: "boolean", description: "Whether page is greater than 1, even when no results match." }
    ContentErrorDetail:
      type: "object"
      required: ["field", "message"]
      properties:
        field: { type: "string", description: "Validation location, such as params.villageId, query.page or body.sourceId." }
        message: { type: "string" }
    ContentErrorResponse:
      type: "object"
      required: ["error"]
      properties:
        error:
          type: "object"
          required: ["code", "message", "details", "requestId"]
          properties:
            code: { type: "string" }
            message: { type: "string" }
            details:
              type: "array"
              items: { $ref: "#/components/schemas/ContentErrorDetail" }
            requestId: { type: "string", description: "Also returned in the X-Request-Id response header." }
            stack: { type: "string", description: "Optional stack trace on HTTP 500 errors in development only." }
    FacilityType:
      type: "string"
      enum: ["SCHOOL", "CLINIC", "LIBRARY", "COMMUNITY_CENTER", "PARK", "SPORTS", "OTHER"]
    Facility:
      type: "object"
      required: ["id", "villageId", "facilityType", "name", "description", "latitude", "longitude", "sourceId", "verificationStatus", "version", "createdAt", "updatedAt", "asOfYear"]
      properties:
        id: { type: "string", format: "uuid" }
        villageId: { type: "string", format: "uuid" }
        facilityType: { $ref: "#/components/schemas/FacilityType" }
        name: { type: "string" }
        description: { type: "string", nullable: true }
        latitude: { type: "number", nullable: true, description: "Decimal coordinate serialized as a JSON number, or null." }
        longitude: { type: "number", nullable: true, description: "Decimal coordinate serialized as a JSON number, or null." }
        sourceId: { type: "string", format: "uuid", nullable: true, description: "Source identifier only; no source object is embedded." }
        verificationStatus: { $ref: "#/components/schemas/ContentVerificationStatus" }
        version: { type: "integer" }
        createdAt: { type: "string", format: "date-time" }
        updatedAt: { type: "string", format: "date-time" }
        asOfYear: { type: "integer", format: "int32", minimum: -2147483648, maximum: 2147483647, nullable: true }
      description: "Public representation shared by GET, POST and PATCH responses. Nullable properties are returned as null; creator/updater IDs and deletedAt are not exposed."
      example:
        id: "22222222-2222-4222-8222-222222222222"
        villageId: "11111111-1111-4111-8111-111111111111"
        facilityType: "SCHOOL"
        name: "مدرسة القرية"
        description: null
        asOfYear: null
        latitude: 32.123456
        longitude: 0
        sourceId: null
        verificationStatus: "PENDING"
        version: 1
        createdAt: "2026-10-10T00:00:00.000Z"
        updatedAt: "2026-10-10T00:00:00.000Z"
    FacilityResponse:
      type: "object"
      required: ["data"]
      properties:
        data: { $ref: "#/components/schemas/Facility" }
    FacilityListResponse:
      type: "object"
      required: ["data", "meta"]
      properties:
        data:
          type: "array"
          items: { $ref: "#/components/schemas/Facility" }
        meta: { $ref: "#/components/schemas/ContentPaginationMeta" }
  responses:
    ContentValidationError:
      description: "Invalid path or query parameters (VALIDATION_ERROR); malformed JSON is INVALID_JSON when a JSON body is sent."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - { field: "params.villageId", message: "Invalid UUID" }
              requestId: "example-request-123"
    ContentVillageNotFound:
      description: "Village does not exist or is soft-deleted."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "NOT_FOUND"
              message: "Village not found"
              details: []
              requestId: "example-request-123"
    ContentInternalError:
      description: "Unexpected database or application failure. Production responses do not expose internal error details."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "Internal server error"
              details: []
              requestId: "example-request-123"
    ContentTooManyRequests:
      description: "Global rate limit exceeded when rate limiting is enabled."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
        Retry-After:
          description: "Seconds until retry."
          schema: { type: "integer" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "TOO_MANY_REQUESTS"
              message: "Too many requests; please try again later"
              details: []
              requestId: "example-request-123"
    FacilityNotFound:
      description: "Resource is missing, soft-deleted, or belongs to a soft-deleted village."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "NOT_FOUND"
              message: "Facility not found"
              details: []
              requestId: "example-request-123"
    ContentIdValidationError:
      description: "Invalid resource UUID (VALIDATION_ERROR)."
      headers:
        X-Request-Id:
          description: "Request correlation ID."
          schema: { type: "string" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentErrorResponse" }
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - { field: "params.id", message: "Invalid UUID" }
              requestId: "example-request-123"
